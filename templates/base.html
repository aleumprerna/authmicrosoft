<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microsoft Mail Sender</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 3rem auto; padding: 0 1rem; color: #242424; }
    input, textarea, select { box-sizing: border-box; display: block; width: 100%; padding: .7rem; margin: .35rem 0 1rem; }
    textarea { min-height: 160px; resize: vertical; }
    button, .button { display: inline-block; border: 0; border-radius: 4px; padding: .7rem 1rem; background: #0067b8; color: white; text-decoration: none; cursor: pointer; }
    .secondary { background: #555; }
    .message { padding: .8rem; margin: 1rem 0; border-radius: 4px; background: #eee; }
    .success { background: #dff6dd; }
    .error { background: #fde7e9; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  </style>
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="message {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
